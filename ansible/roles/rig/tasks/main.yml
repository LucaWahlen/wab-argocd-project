- name: Update the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install runtime packages
  ansible.builtin.apt:
    name:
      - podman
      - curl
      - jq
      - ca-certificates
    state: present

- name: Install kind
  ansible.builtin.get_url:
    url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
    dest: /usr/local/bin/kind
    mode: "0755"

- name: Install kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/v{{ kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"

- name: Install the argocd CLI
  ansible.builtin.get_url:
    url: "https://github.com/argoproj/argo-cd/releases/download/v{{ argocd_version }}/argocd-linux-amd64"
    dest: /usr/local/bin/argocd
    mode: "0755"

- name: Download k6
  ansible.builtin.get_url:
    url: "https://github.com/grafana/k6/releases/download/v{{ k6_version }}/k6-v{{ k6_version }}-linux-amd64.tar.gz"
    dest: /tmp/k6.tar.gz
    mode: "0644"

- name: Unpack k6
  ansible.builtin.unarchive:
    src: /tmp/k6.tar.gz
    dest: /tmp
    remote_src: true

- name: Install k6
  ansible.builtin.copy:
    src: "/tmp/k6-v{{ k6_version }}-linux-amd64/k6"
    dest: /usr/local/bin/k6
    mode: "0755"
    remote_src: true
